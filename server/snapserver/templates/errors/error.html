<!doctype html>
<html lang="it" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} - {{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/awn/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/snap-fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/snap.css') }}">
</head>
<body class="bg-body-tertiary">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body text-center p-5">
          <i class="bi bi-shield-slash text-primary" style="font-size:3rem"></i>
          <h1 class="display-5 fw-bold mt-3">{{ code }}</h1>
          <h2 class="h5">{{ title }}</h2>
          <p class="text-body-secondary">{{ message }}</p>
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Torna alla dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='vendor/awn/index.var.js') }}"></script>
<script src="{{ url_for('static', filename='js/snap-dialogs.js') }}"></script>
</body>
</html>
