# -----------------------------------------------------------------
# Questo file viene incluso da nginx.conf dentro `location = /primo-accesso`,
# seguito da `deny all`: quindi vale solo cio' che e' scritto qui.
#
# Perche' l'elenco e' cosi' corto: finche' la password non e' stata scelta, chi
# apre questa pagina diventa proprietario della sonda. Ammettere "tutta la rete"
# significa che il primo che trova la sonda se la prende. Con il solo loopback la
# sonda appartiene a chi l'ha installata.
#
# ATTENZIONE: dopo che la password e' stata scelta questa pagina reindirizza
# all'accesso normale e l'elenco non ha piu' effetto pratico. Il momento delicato
# e' solo il primo avvio -- ma e' esattamente quello che va protetto.
#
# Per configurare la sonda puntando l'IP della macchina (e non 127.0.0.1),
# aggiungere qui l'indirizzo della PROPRIA postazione, non una rete intera:
#
#   allow 10.20.10.7;      # postazione dell'amministratore
#
# e la stessa cosa nella sonda, con SNAP_PROBE_FIRST_ACCESS_FROM in .env
# (le due barriere sono indipendenti: vanno aperte entrambe, per scelta).

allow 127.0.0.1;
allow ::1;
