# La usa solo docker-compose.nativa.yml (sonda FUORI dal contenitore).
#
# QUESTO FILE NON AMMETTE NESSUNO, ed e' una scelta, non una dimenticanza.
#
# Dietro questo proxy le richieste non arrivano mai dal loopback: la sonda gira sulla
# macchina e il proxy in un contenitore, quindi nginx vede sempre l'indirizzo del
# gateway di Docker -- lo stesso per chi sta alla postazione e per chi arriva dalla
# LAN. Un `allow` su quell'indirizzo non distinguerebbe i due casi: aprirebbe la
# prima impostazione della password a TUTTA la rete, che e' esattamente cio' che
# quella barriera esiste per impedire ("la sonda appartiene a chi l'ha installata").
#
# La prima impostazione ha una via migliore, che in questa variante e' sempre
# disponibile: la sonda ascolta in chiaro sul proprio loopback, quindi
#
#     http://127.0.0.1:5511/primo-accesso
#
# DALLA MACCHINA della sonda, senza passare da qui. La' l'indirizzo del client e' il
# loopback vero e il controllo dell'applicazione lo riconosce.
#
# Dalla rete si passa solo da questo proxy, in HTTPS, e la prima impostazione resta
# chiusa: sotto c'e' `deny all` in nginx.conf.
