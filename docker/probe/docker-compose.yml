# Autore: Daniele Speziale
# Data creazione: 2026-09-09
# Copyright (c) 2024-26 DS Consulting
# Licenza: MIT
# -----------------------------------------------------------------
# Due servizi:
#   snap-probe  la sonda (nmap + agente) in ascolto solo su 127.0.0.1
#   proxy       nginx: termina il TLS ed espone l'interfaccia in HTTPS sulla 5510
#
# La sonda si installa nella rete DEL CLIENTE; il server sta altrove. Per questo e' un
# compose separato da quello del server, e non contiene alcuna base dati PostgreSQL:
# l'archivio locale della sonda e' una coda di conferimento, deve funzionare anche
# isolata dalla rete e resta su SQLite nel proprio volume.
#
# RETE HOST, e non e' un'opzione: una sonda dietro il NAT di Docker vedrebbe la rete
# di Docker, non quella del cliente -- scoprirebbe se stessa e nient'altro. Con
# `network_mode: host` la sonda vede le interfacce reali della macchina.
# Conseguenze da conoscere:
#   * `ports:` non si applica (i processi legano direttamente le porte dell'host);
#   * funziona su Linux; su Docker Desktop (Windows/Mac) la rete host e' limitata e
#     la sonda non vedrebbe la LAN: in esercizio la sonda va su Linux.
#
# Avvio:
#   1. cp .env.example .env  e compilare la chiave di sessione
#   2. mettere certificato e chiave in ./certs/probe.crt e ./certs/probe.key
#   3. docker compose up -d --build
#   4. aprire https://127.0.0.1:5510 DALLA MACCHINA della sonda per scegliere la
#      password (dalla rete la prima impostazione viene rifiutata, per disegno)
#   5. incollare il pacchetto di registrazione SNAP1-... generato dalla console

name: snap-probe

services:
  snap-probe:
    build:
      context: ../..
      dockerfile: docker/probe/Dockerfile
    image: snap-probe:${SNAP_VERSION:-1.2.8}
    container_name: snap-probe
    restart: unless-stopped
    network_mode: host
    # La scansione SYN e il rilevamento del sistema operativo hanno bisogno di socket
    # raw. Si concedono SOLO queste due capacita' (non `privileged: true`, che darebbe
    # tutto): insieme al `setcap` nell'immagine permettono a un processo NON-root di
    # scansionare come si deve.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Nessun altro privilegio: tutte le altre capacita' vengono tolte.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SNAP_PROBE_SECRET_KEY: "${SNAP_PROBE_SECRET_KEY:?chiave di sessione mancante: vedi .env}"
      SNAP_PROBE_BEHIND_PROXY: "1"
      # Il cookie di sessione viaggia solo su HTTPS.
      SNAP_PROBE_COOKIE_SECURE: "1"
      SNAP_PROBE_STORE: /data/snap_probe.sqlite3
      APP_PORT: "5511"
    volumes:
      - probe-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5511/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: snap-probe-proxy
    restart: unless-stopped
    # Stessa rete della sonda: il proxy raggiunge 127.0.0.1:5511 sul loopback
    # dell'host, dove la sonda ascolta.
    network_mode: host
    depends_on:
      snap-probe:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  probe-data:
