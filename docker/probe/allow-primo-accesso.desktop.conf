# NON USARE IN ESERCIZIO. La usa solo docker-compose.desktop.yml.
#
# Dietro il NAT di Docker le richieste non arrivano dal loopback ma dal gateway
# della rete di Docker: con il solo `allow 127.0.0.1` la pagina della prima
# password sarebbe irraggiungibile da qualunque indirizzo e la sonda non si
# potrebbe configurare. Si ammettono le reti private, non "tutti".
#
# In esercizio vale allow-primo-accesso.conf: solo la postazione della sonda.

allow 127.0.0.1;
allow ::1;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 10.0.0.0/8;
